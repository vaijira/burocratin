[package]
name = "burocratin"
version = "0.2.0"
authors = ["Jorge Perez Burgos <vaijira@gmail.com>"]
edition = "2024"
rust-version = "1.99"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies.web-sys]
version = "0.3"
features = [
  "HtmlAnchorElement",
  "HtmlInputElement",
  "FileList",
]

[dependencies]
anyhow = "1.0"
utf16-ext = "0.1"
byteorder = "1.2"
chrono = { version = "0.4", features = ["serde"] }
console_error_panic_hook = "0.1"
csv = "1.1"
dominator = "0.5"
encoding_rs = "0.8"
futures = "0.3"
futures-signals = "0.3"
gloo-file = { version = "0.4", features = [ "futures" ] }
gloo-utils = "0.3"
html5ever = "0.40"
infer = "0.22"
isin = "0.1.18"
js-sys = "0.3"
log = "0.4"
nom = "8.0"
num-format = "0.4"
pdf-extract = "0.12"
rust_decimal = "1.43"
scraper = "0.29"
selectors = "0.41"
serde = { version = "1.0", features = ["derive", "rc"] }
xml-rs = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-logger = "0.2"
zip = { version = "9.0", default-features = false, features = ["deflate"]}

[dev-dependencies]
ctor = "1.0"
env_logger = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json = "1.0"
thirtyfour = "0.38"
tokio = { version = "1.54", features = ["full"] }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
# less code to include into binary
panic = 'abort'
# optimization over all codebase ( better optimization, slower build )
codegen-units = 1
# optimization for size ( more aggressive )
opt-level = "z"  # 3 => fast, s/z => small
# link time optimization using using whole-program analysis
lto = true

# [package.metadata.wasm-pack.profile.release]
# Configured in rollup.config.js
# wasm-opt = ["--enable-bulk-memory", "-Oz"]  # O4 => fast, Oz/Os => small
